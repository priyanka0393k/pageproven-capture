<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Capture</title>
  <link rel="stylesheet" href="overlay.css">
  <style>html, body { background: transparent; }</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="hint" class="chip"></div>
  <div id="sizeLabel" class="chip mono"></div>
  <div id="toast" class="chip"></div>

  <div id="loupe">
    <canvas id="loupeCanvas" width="120" height="120"></canvas>
    <div id="loupeInfo" class="mono"></div>
  </div>

  <div id="tools" class="bar vertical"></div>
  <div id="actions" class="bar horizontal"></div>
  <div id="palette" class="bar popover"></div>

  <textarea id="textInput" spellcheck="false" rows="1"></textarea>

  <script src="editor-api.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
