<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Capture Pin</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; user-select: none; }
    img { display: block; width: 100vw; height: 100vh; cursor: grab; -webkit-user-drag: none; }
    body.dragging img { cursor: grabbing; }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(10, 132, 255, 0.9);
    }
  </style>
</head>
<body>
  <img id="img" alt="" draggable="false" title="Drag to move · scroll to zoom · double-click or Esc to close · right-click for options">
  <script src="pin.js"></script>
</body>
</html>
